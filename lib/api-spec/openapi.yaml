openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Trips
    description: Trip correspondent — photo trips, clustering, and AI-researched narratives.
  - name: Social
    description: User profiles, following, and the friends feed.
  - name: Digests
    description: Periodic "wrapped"-style recap PDFs of a user's completed trips.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: List trips
      responses:
        "200":
          description: List of trips (summary form, no days/photos).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripSummary"
    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create a new trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "201":
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
  /trips/{tripId}:
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Get a trip with its days and photos
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Trips]
      operationId: deleteTrip
      summary: Delete a trip and its photos/days
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Trip deleted.
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/export.pdf:
    get:
      tags: [Trips]
      operationId: exportTripPdf
      summary: Export a ready trip as a downloadable PDF keepsake
      description: |
        Streams back a multi-page PDF: a cover with the trip title/cover
        photo, a stats page (days, distance, locations, temperature range),
        and one section per day with headline, narrative, and photos.
        Respects the same visibility rules as GET /trips/{tripId}.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF generated.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Trip is not ready to export yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate PDF export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/privacy:
    patch:
      tags: [Trips]
      operationId: updateTripPrivacy
      summary: Update a trip's visibility (owner only)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripPrivacyInput"
      responses:
        "200":
          description: Privacy updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Trip not found, or the requester does not own it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/days/{dayId}/hero-photo:
    patch:
      tags: [Trips]
      operationId: updateDayHeroPhoto
      summary: Set which photo represents a trip day (owner only)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDayHeroPhotoInput"
      responses:
        "200":
          description: Hero photo updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDay"
        "400":
          description: Missing or invalid required fields, or the photo does not belong to this day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Trip or day not found, or the requester does not own the trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/days/{dayId}/narrative:
    patch:
      tags: [Trips]
      operationId: updateTripDayNarrative
      summary: Edit a trip day's headline/narrative text directly (owner only)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripDayNarrativeInput"
      responses:
        "200":
          description: Narrative updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDay"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Trip or day not found, or the requester does not own the trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/comments:
    get:
      tags: [Trips]
      operationId: listTripComments
      summary: List a trip's comments
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The trip's comments, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripComment"
        "404":
          description: Trip not found, or the requester cannot view it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Trips]
      operationId: createTripComment
      summary: Post a comment on a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripCommentInput"
      responses:
        "201":
          description: Comment posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripComment"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Trip not found, or the requester cannot view it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/comments/{commentId}:
    delete:
      tags: [Trips]
      operationId: deleteTripComment
      summary: Delete a comment (author or trip owner only)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted.
        "404":
          description: Trip or comment not found, or the requester may not delete it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/companions:
    post:
      tags: [Trips]
      operationId: tagTripCompanion
      summary: Tag a followed user as a companion on a trip (owner only)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCompanionInput"
      responses:
        "201":
          description: Companion tagged (pending their confirmation).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripCompanion"
        "400":
          description: Invalid target, or the owner does not follow that user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Trip not found, or the requester does not own it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/companions/{userId}/respond:
    patch:
      tags: [Trips]
      operationId: respondToCompanionTag
      summary: Accept or decline a companion tag (tagged user only)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondCompanionInput"
      responses:
        "200":
          description: Response recorded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripCompanion"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Trip or companion tag not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/companions/{userId}:
    delete:
      tags: [Trips]
      operationId: untagTripCompanion
      summary: Remove a companion tag (trip owner or the tagged user themself)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tag removed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripCompanion"
        "404":
          description: Trip not found, or the requester may not remove this tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/photos:
    post:
      tags: [Trips]
      operationId: addTripPhotos
      summary: Attach uploaded photos (with EXIF metadata) to a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoBatchInput"
      responses:
        "201":
          description: Photos attached.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/process:
    post:
      tags: [Trips]
      operationId: processTrip
      summary: Cluster photos into days and dispatch the AI correspondent research pipeline
      description: |
        Groups photos into day-clusters by date and location, then asynchronously
        reverse-geocodes, fetches historical weather, fetches nearby landmarks, and
        has Claude write a magazine-style narrative for each day. Returns
        immediately with status "processing" — poll GET /trips/{tripId} for progress.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Processing started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Trip has no photos to process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /trips/{tripId}/days/{dayId}/narration:
    post:
      tags: [Trips]
      operationId: generateDayNarration
      summary: Generate (or return cached) spoken-word audio for a day's narrative
      description: |
        Synthesizes the day's narrative text into speech via text-to-speech
        and stores it in object storage. If audio was already generated for
        this day, returns the cached result instead of re-synthesizing.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Narration audio ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDay"
        "404":
          description: Trip or day not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Day has no narrative to narrate yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to synthesize narration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /users/{userId}:
    get:
      tags: [Social]
      operationId: getUserProfile
      summary: Get a user's public profile and the trips visible to the requester
      description: |
        Visible trips are the owner's public trips, plus (when the requester
        follows the owner) their friends-tier trips, plus (when viewing your
        own profile) everything you own.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /users/{userId}/trip-days:
    get:
      tags: [Social]
      operationId: getUserTripDayLocations
      summary: Get every day-location across a user's visible trips, for a world map
      description: |
        Same visibility rule as GET /users/{userId}'s trip list — flattened
        to one entry per trip day, excluding days with no real GPS
        coordinates.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Day locations across the user's visible trips.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripDayLocation"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /users/{userId}/following:
    get:
      tags: [Social]
      operationId: listFollowing
      summary: List who you follow (self only — powers the companion-tag picker)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Users the requester follows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "404":
          description: Not your own userId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /users/{userId}/settings:
    patch:
      tags: [Social]
      operationId: updateUserSettings
      summary: Update a user's own settings (owner only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettingsInput"
      responses:
        "200":
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found, or not the requesting user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /users/{userId}/follow:
    post:
      tags: [Social]
      operationId: followUser
      summary: Follow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Now following (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        "400":
          description: Cannot follow yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Social]
      operationId: unfollowUser
      summary: Unfollow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: No longer following (or wasn't).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /feed:
    get:
      tags: [Social]
      operationId: getFeed
      summary: Trips from people you follow, newest first
      description: |
        Includes both public and friends-tier trips from every user the
        signed-in viewer follows.
      responses:
        "200":
          description: Feed trips.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedTripSummary"
  /discover:
    get:
      tags: [Social]
      operationId: getDiscoverFeed
      summary: Public trips from people you don't yet follow
      responses:
        "200":
          description: Discoverable trips.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedTripSummary"
  /followers-feed:
    get:
      tags: [Social]
      operationId: getFollowersFeed
      summary: Trips from people who follow you
      responses:
        "200":
          description: Trips from your followers (public, plus friends-tier for anyone you follow back).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedTripSummary"
  /digests:
    get:
      tags: [Digests]
      operationId: listDigests
      summary: List the signed-in user's own trip digests, newest first
      responses:
        "200":
          description: Digests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Digest"
  /digests/generate:
    post:
      tags: [Digests]
      operationId: generateDigest
      summary: Manually generate a digest now, bypassing the automatic cadence
      description: |
        Covers completed trips since the user's last digest (or account
        creation, for their first one) through now. Fails if there are no
        completed trips in that period rather than creating an empty digest.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDigestInput"
      responses:
        "201":
          description: Digest generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Digest"
        "400":
          description: No completed trips since the last digest — nothing to generate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /digests/{digestId}/download:
    get:
      tags: [Digests]
      operationId: downloadDigest
      summary: Download a digest PDF (owner only)
      parameters:
        - name: digestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF streamed.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Digest not found, or the requester does not own it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /digests/{digestId}:
    delete:
      tags: [Digests]
      operationId: deleteDigest
      summary: Delete a digest and its stored PDF (owner only)
      parameters:
        - name: digestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Digest deleted.
        "404":
          description: Digest not found, or the requester does not own it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TripStatus:
      type: string
      enum: [pending, processing, ready, error]
    TripPrivacy:
      type: string
      enum: [private, friends, public]
    TripInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        visualStyle:
          allOf:
            - $ref: "#/components/schemas/DigestStyle"
          description: Visual style preset for this trip's story page. Defaults to canon-camera if omitted.
    UpdateTripPrivacyInput:
      type: object
      required: [privacy]
      properties:
        privacy:
          $ref: "#/components/schemas/TripPrivacy"
    UpdateDayHeroPhotoInput:
      type: object
      required: [heroPhotoId]
      properties:
        heroPhotoId:
          type: ["integer", "null"]
          description: Must belong to this trip day, or null to clear it.
    UpdateTripDayNarrativeInput:
      type: object
      required: [headline, narrative]
      properties:
        headline:
          type: string
          minLength: 1
        narrative:
          type: string
          minLength: 1
    TagCompanionInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          description: Must be someone the trip owner already follows.
    RespondCompanionInput:
      type: object
      required: [accept]
      properties:
        accept:
          type: boolean
    CreateTripCommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    TripSummary:
      type: object
      required: [id, title, status, coverObjectPath, privacy, isOwner, startDate, endDate, createdAt, visualStyle]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: "#/components/schemas/TripStatus"
        coverObjectPath:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        privacy:
          $ref: "#/components/schemas/TripPrivacy"
        visualStyle:
          $ref: "#/components/schemas/DigestStyle"
        isOwner:
          type: boolean
          description: Whether the requesting viewer owns this trip.
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        totalDistanceKm:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
    UserSummary:
      type: object
      required: [id, displayName, avatarUrl]
      properties:
        id:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
    TripDayLocation:
      type: object
      required: [tripId, tripTitle, dayIndex, date, lat, lon, locationName]
      properties:
        tripId:
          type: integer
        tripTitle:
          type: string
        dayIndex:
          type: integer
        date:
          type: string
        lat:
          type: number
        lon:
          type: number
        locationName:
          type: ["string", "null"]
    TripComment:
      type: object
      required: [id, tripId, userId, body, createdAt, author]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        userId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/UserSummary"
    DigestCadenceMonths:
      type: integer
      enum: [3, 4, 6]
      description: How often (in months) this user's wrapped digest is automatically generated.
    GenerateDigestInput:
      type: object
      properties:
        style:
          $ref: "#/components/schemas/DigestStyle"
    DigestStyle:
      type: string
      enum:
        - pop-art
        - supermarket
        - camera-interface
        - canon-camera
        - ios-core
        - android-core
      description: Visual style preset for a wrapped digest PDF.
    UserProfile:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          required: [isSelf, isFollowing, followerCount, followingCount, trips, companionTrips, pendingCompanionInvites, digestCadenceMonths, preferredDigestStyle]
          properties:
            isSelf:
              type: boolean
              description: Whether this profile belongs to the requesting viewer.
            isFollowing:
              type: boolean
              description: Whether the requesting viewer follows this user. Always false for anonymous viewers or your own profile.
            followerCount:
              type: integer
            followingCount:
              type: integer
            trips:
              type: array
              items:
                $ref: "#/components/schemas/TripSummary"
            companionTrips:
              type: array
              description: Trips belonging to other people where this profile's user is a confirmed tagged companion, filtered by the trip's own privacy.
              items:
                $ref: "#/components/schemas/TripSummary"
            pendingCompanionInvites:
              type: array
              description: Companion tags awaiting this profile's response. Only populated when viewing your own profile.
              items:
                type: object
                required: [trip, taggedBy]
                properties:
                  trip:
                    $ref: "#/components/schemas/TripSummary"
                  taggedBy:
                    $ref: "#/components/schemas/UserSummary"
            digestCadenceMonths:
              $ref: "#/components/schemas/DigestCadenceMonths"
            preferredDigestStyle:
              $ref: "#/components/schemas/DigestStyle"
    UpdateUserSettingsInput:
      type: object
      required: [digestCadenceMonths]
      properties:
        digestCadenceMonths:
          $ref: "#/components/schemas/DigestCadenceMonths"
        preferredDigestStyle:
          $ref: "#/components/schemas/DigestStyle"
    FollowState:
      type: object
      required: [isFollowing]
      properties:
        isFollowing:
          type: boolean
    FeedTripSummary:
      allOf:
        - $ref: "#/components/schemas/TripSummary"
        - type: object
          required: [owner]
          properties:
            owner:
              $ref: "#/components/schemas/UserSummary"
    Digest:
      type: object
      required: [id, periodStart, periodEnd, tripCount, createdAt]
      properties:
        id:
          type: integer
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        tripCount:
          type: integer
          description: Number of completed trips covered by this digest.
        createdAt:
          type: string
          format: date-time
    TripCompanionStatus:
      type: string
      enum: [pending, confirmed]
    TripCompanion:
      type: object
      required: [user, status]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        status:
          $ref: "#/components/schemas/TripCompanionStatus"
    Trip:
      allOf:
        - $ref: "#/components/schemas/TripSummary"
        - type: object
          required: [days, photos, companions]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/TripDay"
            photos:
              type: array
              items:
                $ref: "#/components/schemas/Photo"
            companions:
              type: array
              description: Confirmed companions, plus pending ones if the viewer owns this trip.
              items:
                $ref: "#/components/schemas/TripCompanion"
    PhotoInput:
      type: object
      required: [objectPath, filename]
      properties:
        objectPath:
          type: string
        filename:
          type: string
        lat:
          type: ["number", "null"]
        lon:
          type: ["number", "null"]
        takenAt:
          type: ["string", "null"]
          format: date-time
    PhotoBatchInput:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PhotoInput"
    Photo:
      type: object
      required: [id, tripId, objectPath, filename, lat, lon, takenAt, tripDayId]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        objectPath:
          type: string
        filename:
          type: string
        lat:
          type: ["number", "null"]
        lon:
          type: ["number", "null"]
        takenAt:
          type: ["string", "null"]
          format: date-time
        tripDayId:
          type: ["integer", "null"]
    WeatherSummary:
      type: object
      properties:
        tempMaxC:
          type: ["number", "null"]
        tempMinC:
          type: ["number", "null"]
        precipitationMm:
          type: ["number", "null"]
        windSpeedMaxKmh:
          type: ["number", "null"]
        weatherCode:
          type: ["integer", "null"]
        conditions:
          type: ["string", "null"]
    Landmark:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
        distanceMeters:
          type: ["number", "null"]
        lat:
          type: number
        lon:
          type: number
    TripDay:
      type: object
      required: [id, tripId, dayIndex, date, locationName, lat, lon, distanceKm, weather, landmarks, headline, narrative, aiOriginalHeadline, aiOriginalNarrative, heroPhotoId, audioObjectPath]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        dayIndex:
          type: integer
        date:
          type: string
          description: Calendar date (YYYY-MM-DD) for this cluster.
        locationName:
          type: ["string", "null"]
        lat:
          type: number
        lon:
          type: number
        elevationMeters:
          type: ["number", "null"]
        distanceKm:
          type: ["number", "null"]
          description: Distance travelled from the previous day's location.
        routePoints:
          type: array
          description: Chronologically-ordered GPS points from this day's own geotagged photos, for drawing an accurate route through the day.
          items:
            type: object
            required: [lat, lon]
            properties:
              lat:
                type: number
              lon:
                type: number
        weather:
          oneOf:
            - $ref: "#/components/schemas/WeatherSummary"
            - type: "null"
        landmarks:
          type: array
          items:
            $ref: "#/components/schemas/Landmark"
        headline:
          type: ["string", "null"]
        narrative:
          type: ["string", "null"]
        aiOriginalHeadline:
          type: ["string", "null"]
          description: The AI's original headline, captured once and never overwritten by manual edits — lets an edit be reverted.
        aiOriginalNarrative:
          type: ["string", "null"]
          description: The AI's original narrative text, captured once and never overwritten by manual edits — lets an edit be reverted.
        heroPhotoId:
          type: ["integer", "null"]
        audioObjectPath:
          type: ["string", "null"]
          description: Object path of the synthesized narration audio for this day, if generated.
